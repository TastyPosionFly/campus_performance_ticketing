# ===== DataBase (Docker inside) =====
spring.datasource.url=jdbc:mysql://localhost:3306/campus_ticket?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== File URL =====
file.base.url=http://localhost:8080

# ===== WeChat =====
wechat.appid=${WECHAT_APPID}
wechat.secret=${WECHAT_SECRET}

# ===== File Upload (Docker Container Path) =====
user.avatar.upload-dir=./data/avatar
org.avatar.upload-dir=./data/org_avatar
org.album.upload-dir=./data/org_album
venue.album.upload-dir=./data/venue_album
performance.post.upload-dir=./data/performance_post
staff.photo.upload-dir=./data/staff_photo
ticket.photo.upload-dir=./data/ticket_photo

# ===== Temporary Directories =====
performance.post.temp-dir=./data/temp/performance_post
staff.photo.temp-dir=./data/temp/staff_photo